; fdf3-tate settings. Alt+0 in game opens the settings menu; or edit here with the game closed.
[General]
; 0 = horizontal, 1/2/3 = quarter turns. Alt+Left (clockwise) / Alt+Right (counterclockwise) change it in game.
Rotation=0
; 1 = smooth (linear), 0 = sharp (point)
Filter=1
; 1 = HUD layout during gameplay, whole screen in menus and dialog (reads the HUD labels and the dialog box)
AutoDetect=1
; Used only when AutoDetect=0: 1 = HUD layout, 0 = whole screen
DefaultLayout=1
; 1 = whole screen while the dialog box is up, 0 = keep the HUD layout during dialog
DialogWholeScreen=1
; 1 = write detection changes to fdf3-tate-log.txt
Debug=0
; 1 = open the Alt+0 settings window when the game starts
OpenAtStart=0
; Portrait or 4:3 desktop: the game still draws its 16:9 picture, the mod fits it to the screen.
; -1 = auto, 1 = always, 0 = never. Keep Rotation=0 when the desktop itself is rotated.
PortraitDesktop=-1
; Physical shape of the screen, for CRTs or screens that stretch the picture to fill:
; 0 = same as resolution (normal), 1 = 4:3, 2 = 16:9
ScreenShape=0

[Layout]
; Source = area on the normal game screen, in a 2560x1440 reference.
; Destination = spot on the rotated 3:4 layout, in a 1440x1920 reference.
; Both scale to any resolution.
; RectN = srcX,srcY,srcW,srcH, dstX,dstY,dstW,dstH   (Rect0 = playfield)
; optional 2 more numbers = that box's own edge fade x,y (otherwise FeatherX/FeatherY)
RefWidth=2560
RefHeight=1440
CanvasWidth=1440
CanvasHeight=1920
; drawn behind the layout (uncompressed BMP, same 3:4 shape). Delete the line for plain black.
Background=fdf3-tate-bg.bmp
; soft fade on the HUD box edges so they blend into the background (0 = hard edges). Edges touching the playfield or the outer border aren't faded.
FeatherX=24
FeatherY=10
; region whose white text (the difficulty) is zoomed to fill its box, 0 = off
AutoFitRegion=5
; playfield, hi score, score, max point, graze, difficulty, life + bomb, fps
Rect0=416,48,1152,1344, 0,120,1440,1680
Rect1=1610,110,628,62, 8,7,520,52
Rect2=1610,182,628,62, 536,7,520,52
Rect3=1605,440,633,62, 8,63,520,52
Rect4=1605,506,633,62, 536,63,520,52
Rect5=1660,26,500,62, 1064,4,368,112, 40,24
Rect6=1610,252,628,168, 0,1802,442,118, 72,24
Rect7=2440,1376,120,64, 1260,1824,180,96, 110,48
